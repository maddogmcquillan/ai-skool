# Community structure for Learn AI on Circle.
#
# Used two ways:
#   1. As the checklist for building the community by hand (Settings > Spaces).
#   2. As the input to `npm run provision`, which creates everything via the Admin API v2.
#      Re-running is safe: existing slugs and names are kept, missing ones are created.
#
# Lessons are YouTube embeds of the listed creators' videos, credited in each lesson.

community:
  name: Learn AI
  tagline: Learn AI by building things. Ages 11 to 17, and the adults who want to keep up.

# Community-wide settings applied by `npm run provision`.
settings:
  messaging:
    messaging_enabled: true                  # admins can still DM members
    member_to_member_messaging_enabled: false # minors cannot DM each other
    group_messaging_enabled: false
    voice_messages_enabled: false
  hide_emails_on_member_profiles: true
  allow_profile_search_indexing: false       # keep member profiles out of search engines
  # Spaces every new member gets. The classroom is granted by the paywall, not here.
  default_spaces: [welcome, ask-coach, course-requests, parent-hub, show-and-tell, live-sessions]
  new_member_landing_space: welcome

member_tags:
  - { name: Student, color: "#2457A6", is_public: true }
  - { name: Parent, color: "#2A7A4B", is_public: true }
  - { name: Adult learner, color: "#7A4B00", is_public: true }
  - { name: Coach, color: "#6B3FA0", is_public: true }

# Shown on the signup form. Wording to be confirmed with your lawyer before launch.
profile_fields:
  - key: member_role
    label: I am a
    field_type: select
    required: true
    choices: ["Student (11 to 17)", "Parent or guardian", "Adult learner"]
    show_on_signup: true
    show_on_profile: true
  - key: parent_guardian_email
    label: Parent or guardian email
    field_type: text
    required: false
    description: Required for students under 18. Used only for safety and account notices.
    show_on_signup: true
    show_on_profile: false
  - key: parent_consent
    label: Consent
    field_type: checkbox
    required: true
    choices: ["I am the parent or guardian of this student, or I am 18 or older, and I agree to the community rules."]
    show_on_signup: true
    show_on_profile: false

# The account that authors the pinned posts and announcements. Email comes from TEAM_AUTHOR_EMAIL.
team_member:
  name: Learn AI Team
  headline: The people behind Learn AI. Post in Ask Coach or Parent Hub to reach us.
  spaces: [welcome, ask-coach, course-requests, parent-hub, show-and-tell, live-sessions]
  avatar: brand/assets/avatar-team.png

# The member account the answer bot posts as. Email comes from BOT_AUTHOR_EMAIL.
bot_member:
  name: Coach
  headline: AI helper. A real person on the team reads every thread.
  tag: Coach
  spaces: [welcome, ask-coach]
  avatar: brand/assets/avatar-coach.png

# Placeholder spaces from an earlier draft. Deleted by `npm run provision` if they exist.
retired_spaces: [ai-foundations, first-chatbot, ai-creative, ai-safety, ai-everyday, ai-at-work]
retired_space_groups: [kids-courses, adult-courses]

space_groups:
  - name: Start Here
    slug: start-here
    spaces:
      - name: Welcome and Announcements
        slug: welcome
        type: basic
        members_can_post: false
        description: Team announcements, new lesson drops, and live event schedule.
        pinned_posts:
          - title: Start here
            body: |
              # Welcome to Learn AI
              You're in. Here's how to get the most out of it.

              ## 1. Go to the Classroom
              Start with **Beginner AI** and watch the three lessons in order. Then **Intermediate AI**, also in order. After that, the **Project Classes** are yours to pick from: make a game, an app, a website, a chatbot, a song, a comic, and more.

              ## 2. Ask when you're stuck
              Post in **Ask Coach**. Coach, our AI helper, replies within a few minutes, and a real person on the team reads every thread.

              ## 3. Show what you build
              Share screenshots, links and demos in **Show and Tell**. Every project class ends with something you made.

              ## House rules
              - Be kind. Assume the person on the other side is 12.
              - Never share personal information: full name, school, address, phone, social handles, photos of yourself.
              - No meeting up. Direct messages between members are turned off on purpose.
              - See something wrong? Use the report button, or tell a parent.
      - name: Ask Coach
        slug: ask-coach
        type: basic
        members_can_post: true
        description: >
          Stuck on a lesson? Ask here. Coach, our AI helper, answers within a few minutes
          and a human from the team reviews every thread. This is the space the answer bot watches.
        pinned_posts:
          - title: How to ask a question here
            body: |
              # Ask anything about the lessons
              One question per post. Say which lesson you're on, what you tried, and what happened.

              **Coach** is an AI helper. It answers within a few minutes using the lesson material. A real person on the team reads every thread and jumps in when Coach can't help.

              ## Coach will not handle
              - Billing, refunds, passwords or account problems. A person will reply instead.
              - Anything about personal information or meeting up. Please don't post it.
              - If you're upset or in trouble, tell a trusted adult right away. The team is notified too.
      - name: Course Requests
        slug: course-requests
        type: basic
        members_can_post: true
        description: >
          Tell us what you want to learn next. One request per post. Upvote by liking.
          We build the most-liked requests first.
        pinned_posts:
          - title: How course requests work
            body: |
              # Tell us what to build next
              1. Post one idea per post. A title like "Make a game with AI" is perfect.
              2. Like the posts you agree with. Likes are votes.
              3. Every month we pick the most-liked requests and start building.

              Ideas that are already in progress get a comment from the team so you know.
      - name: Parent Hub
        slug: parent-hub
        type: basic
        members_can_post: true
        description: For parents and guardians. Progress tips, safety settings, and how to help at home.
        pinned_posts:
          - title: For parents and guardians
            body: |
              # How this community is run
              - Members cannot send each other direct messages. Only the team can message members.
              - Every question thread is answered by Coach, an AI helper, and read by a real person on the team.
              - Profiles hide email addresses and are not indexed by search engines.
              - Anything reported is reviewed the same day.

              ## What the lessons are
              Each lesson is a hand-picked video from an expert creator, credited in the lesson, plus our notes and a project. Some project classes use tools with free tiers and one, Midjourney, is paid. Each lesson says which.

              ## How to help at home
              Ask what they built this week. Every project class ends with something real, and explaining it out loud is the best review there is.

              Questions about billing or your child's account: post here or email the support address on the website.

  - name: Classroom
    slug: classroom-group
    spaces:
      - name: Classroom
        slug: classroom
        type: course
        description: >
          Three sections, in order: Beginner AI, Intermediate AI, then Project Classes where you
          make something real with AI. Lessons are hand-picked videos from expert creators plus our
          notes and projects.
        sections:
          - name: "Beginner AI"
            lessons:
              - name: What is AI?
                youtube: uMzUB89uSxU
                creator: Simplilearn
                description: A short plain-language intro to what artificial intelligence is, how it works at a high level, and where it already shows up in daily life. The starting point before any tools.
              - name: Generative AI in a Nutshell
                youtube: 2IK3DFHRFfw
                creator: Henrik Kniberg
                description: Explains how generative AI, like chatbots and image generators, works and why it's different from normal software, with simple visuals. Gives you the mental model for everything that follows.
              - name: ChatGPT Power User in 30 Minutes
                youtube: dG3O3ePj-b8
                creator: Santrel Media
                description: A hands-on walkthrough of ChatGPT. How to prompt it, use its main features, and get genuinely useful results. Your first "actually use a tool" lesson.
          - name: "Intermediate AI"
            lessons:
              - name: Large Language Models, Explained Briefly
                youtube: WMcwoIyK4DA
                creator: 3Blue1Brown, via the Computer History Museum
                description: A clear visual explanation of how large language models work under the hood. Tokens, prediction, training. So you understand the "why" behind the tools.
              - name: The Perfect ChatGPT Prompt Formula
                youtube: jC4v5AS4RIM
                creator: Jeff Su
                description: A repeatable formula for writing prompts that get better, more reliable results. Turns casual use into a real skill.
              - name: What are AI Agents?
                youtube: F8NKVhkZZWI
                creator: IBM Technology
                description: Introduces AI agents, AI that can take actions and complete multi-step tasks on its own, and how they differ from a regular chatbot.
              - name: AI Agents Fundamentals in 21 Minutes
                youtube: qU3fmidNbJE
                creator: Tina Huang
                description: A practical look at how AI agents are built and what they can do, bridging toward actually building things.
          - name: "Project Classes: Make X with AI"
            lessons:
              - name: Make a Game
                youtube: xWJDvub8Hws
                creator: Jagger Bellagarda
                description: Build a playable game from scratch with no-code AI tools, ending in a game you can play and share.
              - name: Make an App
                youtube: pZpoACNOPAw
                creator: Tech With Tim
                description: A full beginner build of a real, working app with AI, from idea to a deployed, live product.
              - name: Make a Website
                youtube: 3FJZh6SR7IA
                creator: Tyler Moore
                description: Build and publish a live website using AI tools, ending with a real site online.
              - name: Make a Chatbot
                youtube: 0Q1AQAxpdGg
                creator: Kevin Stratvert
                description: Build a custom chatbot tailored to a specific purpose, no coding needed.
              - name: Make an AI Agent
                youtube: dpoMEcXjVH8
                creator: Kevin Stratvert
                description: A beginner build of a working AI agent that automates a task, using free tools.
              - name: Make a Video
                youtube: i8_Pz7sBp_M
                creator: Kevin Stratvert
                description: Generate original videos from text prompts with Sora, from prompt to finished clips.
              - name: Make a Cartoon
                youtube: F20s6U9EPoM
                creator: Level up with Blessing
                description: The full workflow for making an animated cartoon with AI. Script, characters, scenes, and editing into a finished short.
              - name: Make Music
                youtube: cmrRFapWeEE
                creator: Stellar Media
                description: Create original songs with AI, from prompt to a finished, playable track.
              - name: Make AI Art
                youtube: r2JQTh8y3yk
                creator: Technically Trent
                description: Generate high-quality AI images with Midjourney, including the key settings.
                note: Midjourney is a paid tool with no free tier. Ask a parent before signing up.
              - name: Make a Comic
                youtube: LPtRRBvRTg8
                creator: Tao Prompts
                description: Create a full comic with consistent characters using AI image tools plus layout, ending with a finished comic.

  - name: Community
    slug: community
    spaces:
      - name: Show and Tell
        slug: show-and-tell
        type: basic
        members_can_post: true
        description: Share what you built. Screenshots, links, demos.
      - name: Live Sessions
        slug: live-sessions
        type: event
        description: Weekly build-along and Q&A calls.
