# Visual branding applied by `npm run brand`. Files live in brand/assets (generated by the
# brand generator; regenerate rather than hand-edit). Sizes follow Circle's image size guide:
# space covers 1600x500, mobile thumbnails 800x450, post covers 1200x630.

community:
  brand_color: { light: "#3B7BFF", dark: "#7FA8FF" }
  brand_text_color: { light: "#FFFFFF", dark: "#0B1220" }

# Per space: sidebar emoji (only applied with `npm run brand -- --emoji`; the custom icon files
# uploaded by hand replace them, see docs/BRANDING.md),
# cover image, mobile thumbnail, and display tweaks.
spaces:
  welcome:
    emoji: "👋"
    cover: brand/assets/cover-welcome.png
    thumbnail: brand/assets/thumb-welcome.png
    cover_style: wide
    pinned_posts_label: Start here
    display_view: posts
  ask-coach:
    emoji: "💬"
    cover: brand/assets/cover-ask-coach.png
    thumbnail: brand/assets/thumb-ask-coach.png
    cover_style: wide
    pinned_posts_label: Read first
    display_view: posts
  course-requests:
    emoji: "💡"
    cover: brand/assets/cover-course-requests.png
    thumbnail: brand/assets/thumb-course-requests.png
    cover_style: wide
    pinned_posts_label: How it works
    display_view: posts
  parent-hub:
    emoji: "🛡️"
    cover: brand/assets/cover-parent-hub.png
    thumbnail: brand/assets/thumb-parent-hub.png
    cover_style: wide
    pinned_posts_label: For parents
    display_view: posts
  classroom:
    emoji: "🎓"
    cover: brand/assets/cover-classroom.png
    thumbnail: brand/assets/thumb-classroom.png
    cover_style: wide
    course:
      course_type: self_paced
      custom_lesson_label: class
      custom_section_label: section
  show-and-tell:
    emoji: "🖼️"
    cover: brand/assets/cover-show-and-tell.png
    thumbnail: brand/assets/thumb-show-and-tell.png
    cover_style: wide
    display_view: cards
  live-sessions:
    emoji: "🎥"
    cover: brand/assets/cover-live-sessions.png
    thumbnail: brand/assets/thumb-live-sessions.png
    cover_style: wide

# Cover images for the pinned posts created by `npm run provision` (matched by title).
posts:
  - { space: welcome, title: Start here, cover: brand/assets/post-start-here.png }
  - { space: ask-coach, title: How to ask a question here, cover: brand/assets/post-how-to-ask.png }
  - { space: course-requests, title: How course requests work, cover: brand/assets/post-course-requests-how.png }
  - { space: parent-hub, title: For parents and guardians, cover: brand/assets/post-for-parents.png }
